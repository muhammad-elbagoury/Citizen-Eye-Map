<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Voice Input</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎤</text></svg>">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        font-family: "Avenir Next", Avenir, "Helvetica Neue", sans-serif;
        background: #f5f5f5;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        gap: 14px;
        color: #323232;
        user-select: none;
      }

      h3 {
        font-size: 11px;
        font-weight: 700;
        color: #6a6a6a;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      #mic-btn {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        border: none;
        background: #0079c1;
        color: white;
        font-size: 32px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.2s, transform 0.15s;
        outline: none;
      }

      #mic-btn:hover:not(:disabled) {
        background: #005a8f;
        transform: scale(1.06);
      }

      #mic-btn:disabled { cursor: default; opacity: 0.7; }

      #mic-btn.listening {
        background: #d83020;
        animation: pulse 1.1s ease-in-out infinite;
      }

      #mic-btn.done { background: #137547; }

      @keyframes pulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(216, 48, 32, 0.5); }
        50%       { box-shadow: 0 0 0 16px rgba(216, 48, 32, 0); }
      }

      #status {
        font-size: 13px;
        color: #6a6a6a;
        text-align: center;
        max-width: 230px;
        min-height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        line-height: 1.4;
      }

      .lang-row {
        display: flex;
        gap: 8px;
      }

      .lang-btn {
        padding: 4px 16px;
        border-radius: 12px;
        border: 1.5px solid #0079c1;
        background: white;
        color: #0079c1;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
        transition: background 0.15s, color 0.15s;
      }

      .lang-btn.active {
        background: #0079c1;
        color: white;
      }
    </style>
  </head>
  <body>
    <h3>Voice Input</h3>
    <button id="mic-btn" autofocus>🎤</button>
    <div id="status">Click the mic to speak</div>
    <div class="lang-row">
      <button class="lang-btn" id="btn-ar">AR</button>
      <button class="lang-btn" id="btn-en">EN</button>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      let lang = params.get("lang") || "ar-EG";

      const micBtn = document.getElementById("mic-btn");
      const status = document.getElementById("status");
      const btnAr  = document.getElementById("btn-ar");
      const btnEn  = document.getElementById("btn-en");

      // Declare at outer scope so setLang can reference it safely
      let recognition = null;

      function setLang(l) {
        lang = l;
        btnAr.classList.toggle("active", l === "ar-EG");
        btnEn.classList.toggle("active", l === "en-US");
        if (recognition) recognition.lang = l;
      }

      btnAr.addEventListener("click", () => setLang("ar-EG"));
      btnEn.addEventListener("click", () => setLang("en-US"));
      setLang(lang);

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

      if (!SpeechRecognition) {
        status.textContent = "Speech recognition is not supported in this browser.";
        micBtn.disabled = true;
      } else {
        recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.lang = lang;

        let isListening = false;

        async function translateToArabic(text) {
          const res  = await fetch(
            `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|ar`
          );
          const data = await res.json();
          return data?.responseData?.translatedText || text;
        }

        micBtn.addEventListener("click", () => {
          if (!isListening) {
            status.textContent = "Waiting for microphone...";
            recognition.start();
          }
        });

        recognition.addEventListener("start", () => {
          isListening = true;
          micBtn.classList.add("listening");
          micBtn.textContent = "⏹";
          status.textContent = lang === "ar-EG" ? "جارٍ الاستماع... تكلّم الآن" : "Listening... speak now";
        });

        recognition.addEventListener("end", () => {
          isListening = false;
          if (!micBtn.classList.contains("done")) {
            micBtn.classList.remove("listening");
            micBtn.textContent = "🎤";
            if (!status.textContent.includes("Error")) {
              status.textContent = "Click the mic to speak";
            }
          }
        });

        recognition.addEventListener("result", async (event) => {
          const transcript = event.results[0][0].transcript.trim();
          if (!transcript) return;

          micBtn.disabled = true;
          micBtn.classList.remove("listening");
          status.textContent = lang === "en-US" ? "Translating to Arabic..." : "Processing...";

          let finalText = transcript;
          if (lang === "en-US") {
            try {
              finalText = await translateToArabic(transcript);
            } catch (e) {
              // fall back to original transcript
            }
          }

          if (window.opener) {
            window.opener.postMessage({ type: "voice-result", text: finalText }, "*");
          }

          micBtn.classList.add("done");
          micBtn.textContent = "✓";
          status.textContent = "Sent to chat!";
          setTimeout(() => window.close(), 900);
        });

        recognition.addEventListener("error", (event) => {
          micBtn.classList.remove("listening");
          micBtn.textContent = "🎤";
          isListening = false;
          micBtn.disabled = false;
          if (event.error === "not-allowed") {
            status.textContent = "Microphone access denied. Please allow it in your browser and try again.";
          } else {
            status.textContent = "Error: " + event.error + " — click mic to try again.";
          }
        });
      }
    </script>
  </body>
</html>
