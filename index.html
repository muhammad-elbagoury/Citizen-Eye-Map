<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>AI Assistant component (beta) | Sample | ArcGIS Maps SDK for JavaScript</title>
    <!-- Hide undefined web components until they are registered — prevents FOUC -->
    <style>:not(:defined) { visibility: hidden; }</style>
    <!-- ArcGIS components loaded from npm via Vite -->
    <script type="module" src="/main.js"></script>

    <!--
      The built-in ArcGIS sign-in dialog shows the raw item ID in
      "Please sign in to access the item on ArcGIS Online (...)" because it
      can't look up the item's title before authenticating. Strip that part
      out wherever it appears, while leaving the credential prompt itself
      (and the requirement to sign in) untouched.
    -->
    <script type="module">
      const itemIdPattern = /\(\s*[0-9a-f]{32}\s*\)/i;
      const itemIdPatternGlobal = /\(\s*[0-9a-f]{32}\s*\)/gi;

      function stripItemId(root) {
        const nodes =
          root.nodeType === Node.TEXT_NODE
            ? [root]
            : [];
        const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
        let node;
        while ((node = walker.nextNode())) {
          nodes.push(node);
        }
        for (const textNode of nodes) {
          if (!itemIdPattern.test(textNode.textContent)) {
            continue;
          }
          textNode.textContent = textNode.textContent.replace(itemIdPatternGlobal, "");
          const parent = textNode.parentElement;
          if (parent && !parent.textContent.trim()) {
            parent.style.display = "none";
          }
        }
      }

      new MutationObserver((mutations) => {
        for (const mutation of mutations) {
          for (const added of mutation.addedNodes) {
            stripItemId(added);
          }
        }
      }).observe(document.documentElement, { childList: true, subtree: true });
    </script>
  </head>

  <body>
    <calcite-shell>
      <arcgis-map id="Violations_Map" item-id="bced6196e7f94e8ab380f503fbf7e614">
        <arcgis-zoom slot="top-left"></arcgis-zoom>
        <arcgis-expand slot="top-left">
          <arcgis-legend></arcgis-legend>
        </arcgis-expand>
      </arcgis-map>
      <calcite-shell-panel slot="panel-end" width="m" id="assistant-panel">
        <calcite-panel>
          <calcite-action
            id="mic-button"
            slot="header-actions-end"
            icon="microphone"
            text="Voice input"
            title="Speak your prompt">
          </calcite-action>
          <arcgis-assistant
            log-enabled
            copy-enabled
            reference-element="#Violations_Map"
            heading="عين المواطن – شكاوى ومشكلات المرافق العامة"
            description="استكشاف بلاغات المواطنين عن مشكلات القمامة والإنارة وغيرها"
            entry-message="أهلاً بك! أنا هنا لمساعدتك على استكشاف بلاغات المواطنين عن المشكلات اليومية في البيئة المحيطة، مثل القمامة وكسر أعمدة الإنارة، حسب المحافظة ونوع المخالفة.">
            <arcgis-assistant-navigation-agent></arcgis-assistant-navigation-agent>
            <arcgis-assistant-data-exploration-agent></arcgis-assistant-data-exploration-agent>
            <arcgis-assistant-help-agent></arcgis-assistant-help-agent>
            <arcgis-assistant-agent id="chart-agent-el"></arcgis-assistant-agent>
          </arcgis-assistant>
          <calcite-notice id="voice-notice" icon="microphone" closable kind="warning">
            <div slot="title">Voice prompt</div>
            <div slot="message" id="voice-notice-message"></div>
          </calcite-notice>
        </calcite-panel>
      </calcite-shell-panel>
    </calcite-shell>

    <script type="module">
      const assistantElement = document.querySelector("arcgis-assistant");
      const mapElement = document.querySelector("arcgis-map");

      assistantElement.suggestedPrompts = [
        "لخصلي الوضع الحالي للبلاغات",
        "ارسم مخطط بياني لأنواع المخالفات",
        "أظهر توزيع البلاغات حسب المحافظة في رسم بياني",
        "قارن المخالفات في القاهرة والإسكندرية",
        "تطور البلاغات خلال الأشهر الماضية في مخطط خطي",
        "اعرضلي محافظة القاهرة على الخريطة"
      ];

      // Cyan highlight for clicked features AND assistant query results.
      function initHighlight(view) {
        const activeHighlights = new Map(); // layerView → HighlightHandle
        const watchedLVs = new Set();

        function clearLayerHighlight(lv) {
          if (activeHighlights.has(lv)) { activeHighlights.get(lv).remove(); activeHighlights.delete(lv); }
        }
        function clearAllHighlights() {
          for (const h of activeHighlights.values()) h.remove();
          activeHighlights.clear();
        }

        // Click any feature to select it; click empty space to deselect.
        view.on("click", async (clickEvent) => {
          clearAllHighlights();
          const hit = await view.hitTest(clickEvent);
          const features = hit.results.filter(r => r.layer?.type === "feature");
          if (!features.length) return;
          const byLayer = new Map();
          for (const r of features) {
            if (!byLayer.has(r.layer)) byLayer.set(r.layer, []);
            byLayer.get(r.layer).push(r.graphic);
          }
          for (const [layer, graphics] of byLayer) {
            const lv = await view.whenLayerView(layer);
            activeHighlights.set(lv, lv.highlight(graphics));
          }
        });

        // Poll featureEffect / filter / definitionExpression on each feature layer view.
        // The agent sets these via internal paths that bypass reactive change detection,
        // so polling is the only reliable way to mirror the effect as a cyan highlight.
        function watchLayerView(layer, lv) {
          let lastFE, lastF, lastDE;
          async function sync(filter) {
            clearLayerHighlight(lv);
            if (!filter) return;
            const q = layer.createQuery();
            if (filter.where) q.where = filter.where;
            if (filter.geometry) { q.geometry = filter.geometry; q.spatialRelationship = filter.spatialRelationship || "intersects"; }
            try {
              const r = await lv.queryFeatures(q);
              if (r.features.length) activeHighlights.set(lv, lv.highlight(r.features));
            } catch (_) {}
          }
          setInterval(() => {
            const fe = lv.featureEffect, f = lv.filter, de = layer.definitionExpression;
            if (fe !== lastFE) {
              lastFE = fe;
              // featureEffect already provides visual emphasis (included = bright, excluded = dimmed).
              // Calling lv.highlight() on top applies cyan to all features regardless of the filter,
              // causing non-Cairo features to appear highlighted even while dimmed. Let featureEffect own the visual.
              clearLayerHighlight(lv);
            }
            if (f  !== lastF)  { lastF  = f;  sync(f  ?? null); }
            if (de !== lastDE) {
              lastDE = de;
              clearLayerHighlight(lv);
              if (de && de !== "1=1") {
                const q = layer.createQuery(); q.where = de;
                lv.queryFeatures(q).then(r => { if (r.features.length) activeHighlights.set(lv, lv.highlight(r.features)); }).catch(() => {});
              }
            }
          }, 300);
        }

        function tryAttach(lv) {
          if (!lv || watchedLVs.has(lv) || lv.layer?.type !== "feature") return;
          watchedLVs.add(lv);
          watchLayerView(lv.layer, lv);
        }

        view.allLayerViews.forEach(lv => tryAttach(lv));
        view.on("layerview-create", ({ layerView }) => tryAttach(layerView));
      }

      // Start as soon as mapElement.view is available (polling fallback for VSCode browser).
      let ready = false;
      mapElement.addEventListener("arcgisViewReadyChange", (e) => { if (e.detail?.ready && !ready) { ready = true; initHighlight(mapElement.view); } });
      const poll = setInterval(() => { if (mapElement.view) { clearInterval(poll); if (!ready) { ready = true; initHighlight(mapElement.view); } } }, 500);

      const micButton = document.getElementById("mic-button");
      const voiceNotice = document.getElementById("voice-notice");
      const voiceNoticeMessage = document.getElementById("voice-notice-message");
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

      // Recursively search through nested shadow roots for elements matching `predicate`.
      function findDeepElements(root, predicate, results = []) {
        for (const el of root.querySelectorAll("*")) {
          if (predicate(el)) {
            results.push(el);
          }
          if (el.shadowRoot) {
            findDeepElements(el.shadowRoot, predicate, results);
          }
        }
        return results;
      }

      // Locate the assistant's own "Type your message here..." chat input textarea.
      function getAssistantTextarea() {
        const root = assistantElement.shadowRoot;
        if (!root) {
          return null;
        }
        const textareas = findDeepElements(root, (el) => el.tagName === "TEXTAREA");
        const withPlaceholder = textareas.find((el) =>
          (el.getAttribute("placeholder") || "").toLowerCase().includes("type your message")
        );
        return withPlaceholder || textareas[0] || null;
      }

      // Fill the assistant's chat input with the recognized text, but don't submit it.
      // The user can review/edit it there and click "Ask" themselves.
      function fillAssistantPrompt(text) {
        const textarea = getAssistantTextarea();
        if (!textarea) {
          return false;
        }
        const setValue = Object.getOwnPropertyDescriptor(HTMLTextAreaElement.prototype, "value").set;
        setValue.call(textarea, text);
        textarea.dispatchEvent(new Event("input", { bubbles: true, composed: true }));
        textarea.dispatchEvent(new Event("change", { bubbles: true, composed: true }));
        textarea.focus();
        return true;
      }

      const insideIframe = window.self !== window.top;

      if (insideIframe) {
        micButton.title = "Click to open voice input";
        micButton.addEventListener("click", () => {
          const popupUrl = new URL("popup.html", window.location.href).href;
          const left = Math.round((screen.width - 320) / 2);
          const top  = Math.round((screen.height - 280) / 2);
          window.open(popupUrl, "voice-input", `width=320,height=280,left=${left},top=${top},resizable=no,toolbar=no,menubar=no,scrollbars=no,status=no`);
        });
        window.addEventListener("message", (event) => {
          if (event.data?.type === "voice-result" && event.data.text) {
            if (!fillAssistantPrompt(event.data.text)) {
              voiceNoticeMessage.textContent = `Heard: "${event.data.text}"`;
              voiceNotice.open = true;
            }
          }
        });
      } else if (SpeechRecognition) {
        const recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.lang = "ar-EG";

        let isListening = false;

        micButton.addEventListener("click", () => {
          if (isListening) {
            recognition.stop();
          } else {
            recognition.start();
          }
        });

        recognition.addEventListener("start", () => {
          isListening = true;
          micButton.active = true;
          micButton.loading = true;
        });

        recognition.addEventListener("end", () => {
          isListening = false;
          micButton.active = false;
          micButton.loading = false;
        });

        recognition.addEventListener("result", (event) => {
          const transcript = event.results[0][0].transcript.trim();
          if (!transcript) return;
          if (!fillAssistantPrompt(transcript)) {
            voiceNoticeMessage.textContent = `Couldn't find the chat input field. Heard: "${transcript}"`;
            voiceNotice.open = true;
          }
        });

        recognition.addEventListener("error", (event) => {
          console.error("Speech recognition error:", event.error);
        });
      } else {
        micButton.disabled = true;
        micButton.title = "Speech recognition is not supported in this browser.";
      }
    </script>
  </body>
